name: build-deploy

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@master
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'
        bundler-cache: true
    - name: Build the site
      # jekyll/builder 镜像默认时区为 America/Chicago，保持一致避免日期输出变化
      env:
        TZ: America/Chicago
      run: bundle exec jekyll build --future
    - name: copy file via ssh
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USER }}
        key: ${{ secrets.KEY }}
        port: ${{ secrets.PORT }}
        source: "${{ github.workspace }}/_site/*"
        target: ${{ secrets.PATH }}
        overwrite: true
        strip_components: 3

